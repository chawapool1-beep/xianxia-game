*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#04020a;color:#f6ecd4;font-family:"KanitE","Kanit","Noto Sans Thai",sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#app{position:relative;margin:0 auto;height:100%;width:min(100vw,56.25vh);overflow:hidden;background:#120c24}
canvas{display:block}
#scene,#fx{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:6}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;padding:8px 12px 6px;text-align:center;background:linear-gradient(#000a,#0000)}
#realm{font-size:21px;font-weight:600;color:#ffd77a;text-shadow:0 0 12px #ffb84a,0 2px 0 #5a2a00}
#sub{font-size:12px;opacity:.85;margin-top:-2px}
#qi{font-size:26px;font-weight:600;text-shadow:0 0 12px #8fe3ff}
#rate{font-size:12px;opacity:.85}
#bar{height:10px;margin:5px 6px 0;border-radius:8px;background:#0008;border:1px solid #ffd77a66;overflow:hidden}
#barf{height:100%;width:0;background:linear-gradient(90deg,#6fd3ff,#c79bff,#ffe08a);transition:width .15s;box-shadow:0 0 10px #ffe08a}
#need{font-size:11px;opacity:.8;margin-top:2px}
.chip{position:absolute;top:8px;font-size:12px;background:#0009;padding:3px 8px;border-radius:10px;z-index:7;border:1px solid #ffffff22;color:#fff}
#tapzone{position:absolute;left:0;right:0;top:20%;height:36%;z-index:2}
#brk{position:absolute;left:50%;top:51%;transform:translateX(-50%);z-index:7;display:none;padding:10px 22px;font-size:17px;font-weight:600;border:0;border-radius:24px;color:#2a1500;background:linear-gradient(#fff2b0,#ffb84a);box-shadow:0 0 22px #ffcf5a;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
#nav{position:absolute;left:0;right:0;bottom:0;height:58px;display:flex;z-index:20;background:linear-gradient(#1a1230,#0b0716);border-top:1px solid #ffd77a44}
#nav button{flex:1;background:none;border:0;color:#a99bc0;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
#nav button span{font-size:21px;transition:transform .2s}
#nav button.on{color:#ffd77a}
#nav button.on span{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 6px #ffcf5a)}
#nav i.dot{position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 6px #ff4d6d;display:none}
.view{position:absolute;left:0;right:0;bottom:58px;z-index:8;display:none;flex-direction:column}
.view.on{display:flex}
#v-cult{height:36%;background:linear-gradient(#1b1336ee,#0e0a1ef5);border-top:2px solid #ffd77a55;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px #0008}
.full{top:132px;background:linear-gradient(#150f2cf2,#0b0816fa);border-top:2px solid #ffd77a44;border-radius:18px 18px 0 0}
.tabs{display:flex;padding:0 6px}
.tabs button{flex:1;padding:8px 0;background:none;border:0;color:#b9abd0;font-size:14px;border-bottom:2px solid transparent}
.tabs button.on{color:#ffd77a;border-color:#ffd77a}
.scroll{flex:1;overflow-y:auto;padding:8px 8px 16px;-webkit-overflow-scrolling:touch}
.card{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#ffffff14,#ffffff06);border:1px solid #ffffff18;border-radius:12px;padding:7px 9px;margin-bottom:7px}
.card .ic{font-size:24px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#0005}
.card .tx{flex:1;font-size:12.5px;line-height:1.3}
.card .tx b{font-size:14px;color:#ffe9b0;font-weight:600}
.card .tx small{opacity:.75}
.btn{min-width:72px;padding:8px 8px;border:0;border-radius:10px;font-size:13px;font-weight:600;background:linear-gradient(#ffe08a,#f5b342);color:#2a1500;box-shadow:0 2px 0 #8a5a10}
.btn:disabled{background:#4a4458;color:#958da6;box-shadow:none}
.btn.alt{background:linear-gradient(#a8d8ff,#5a9be0);color:#061a33;box-shadow:0 2px 0 #1a4a80}
.btn.red{background:linear-gradient(#ff8a8a,#c43a3a);color:#fff;box-shadow:0 2px 0 #6a1010}
.sec{font-size:13px;color:#ffd77a;margin:10px 2px 6px;font-weight:600;letter-spacing:.3px}
.prog{height:6px;background:#0007;border-radius:4px;overflow:hidden;margin-top:3px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#6fd3ff,#ffe08a)}
/* map */
#v-map{top:132px}
#mapwrap{flex:1;overflow-y:auto;position:relative;border-radius:18px 18px 0 0}
#mapin{position:relative;width:100%}
.region{position:relative;overflow:hidden}
.rtitle{position:absolute;left:10px;top:10px;z-index:3;font-size:17px;font-weight:600;text-shadow:0 2px 6px #000;background:#0006;padding:2px 10px;border-radius:10px}
.rlock{position:absolute;inset:0;z-index:4;background:#000a;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:15px;text-align:center;backdrop-filter:blur(2px)}
.node{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:3;background:radial-gradient(#3a2c5a,#120a24);box-shadow:0 0 10px #0009;padding:0}
.node.done{border-color:#7dffb0;opacity:.85}
.node.cur{border-color:#ffd77a;box-shadow:0 0 18px #ffcf5a;animation:bob 1.2s infinite}
.node.lock{filter:grayscale(1) brightness(.5)}
.node.boss{width:66px;height:66px;margin:-33px 0 0 -33px;font-size:32px;border-color:#ff6b6b}
@keyframes bob{50%{transform:translateY(-5px)}}
.deco{position:absolute;pointer-events:none;z-index:1}
#hunt{position:absolute;right:10px;bottom:10px;z-index:5}
/* inventory */
#herobox{display:flex;gap:6px;padding:8px}
#heroc{width:44%;aspect-ratio:3/4;border-radius:14px;background:radial-gradient(#4a3a7a,#140c28);border:1px solid #ffd77a44}
#slots{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.slot{border-radius:10px;border:2px solid #ffffff22;background:#0005;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;padding:3px;min-height:52px;position:relative}
.slot .e{font-size:20px}
.slot .en{position:absolute;top:1px;right:4px;font-size:10px;color:#ffe08a}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:0 8px;font-size:11px}
#stats div{background:#ffffff0d;border-radius:7px;padding:3px;text-align:center}
#stats b{display:block;font-size:13px;color:#ffe9b0}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.itm{aspect-ratio:1;border-radius:10px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;background:#0006}
.itm .en{position:absolute;bottom:0;right:3px;font-size:10px;color:#ffe08a;font-weight:600}
.itm .lv{position:absolute;top:0;left:3px;font-size:9px;opacity:.8}
.mats{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;padding:4px 8px}
.mats span{background:#0006;border-radius:8px;padding:2px 7px;border:1px solid #ffffff1a}
/* battle */
#battle{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:#000}
#bc{width:100%;height:64%}
#bui{flex:1;justify-content:center;background:linear-gradient(#1b1336,#0b0716);border-top:2px solid #ffd77a55;padding:8px;display:flex;flex-direction:column;gap:6px}
#blog{font-size:12px;height:36px;overflow:hidden;opacity:.85;text-align:center}
#skills{display:flex;gap:8px;justify-content:center}
.sk{width:22%;aspect-ratio:1;border-radius:16px;border:2px solid #ffd77a88;background:radial-gradient(#4a3a7a,#1a1030);color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0}
.sk span{font-size:28px}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:#000b;pointer-events:none}
.sk.rdy{box-shadow:0 0 14px #ffcf5a}
#brow{display:flex;gap:8px;justify-content:center}
#bres{position:absolute;inset:0;z-index:5;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}
#bres .box{width:100%}
/* overlays */
#trib{position:absolute;inset:0;z-index:40;display:none;background:radial-gradient(#3a2b6a66,#000e)}
#tribc{position:absolute;inset:0;width:100%;height:100%}
#tribh{position:absolute;top:13%;left:0;right:0;text-align:center;font-size:21px;color:#bfe8ff;text-shadow:0 0 8px #6cf;pointer-events:none}
#modal{position:absolute;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}

function rollRar(bonus){let x=100-(100-Math.random()*100)/(1+bonus/25);const th=[55,80,92,97.5,99.6];let r=0;while(r<5&&x>=th[r])r++;return r;}
function statVal(k,ilvl,rm){return FLAT[k]?STB[k]*Math.pow(1.12,ilvl)*rm:STB[k]*(1+ilvl*0.04)*rm;}
function mkItem(slotK,ilvl,rar){const sl=slotK?SLOTS.find(s=>s.k===slotK):SLOTS[Math.floor(Math.random()*6)];
 const it={id:S.nid++,slot:sl.k,rar,lvl:Math.max(1,Math.round(ilvl)),enh:0,name:sl.names[rar],main:{k:sl.main,v:0},subs:[]};
 it.main.v=statVal(sl.main,it.lvl,RARM[rar]);rollSubs(it);if(rar>=4)S.c.leg++;return it;}
function rollSubs(it){const keys=Object.keys(STB).filter(k=>k!==it.main.k);it.subs=[];const n=Math.min(4,it.rar);
 for(let i=0;i<n;i++){const k=keys.splice(Math.floor(Math.random()*keys.length),1)[0];it.subs.push({k,v:statVal(k,it.lvl,0.35+Math.random()*0.4)});}}
function itemStats(it){const o={};const m=1+0.1*it.enh;o[it.main.k]=(o[it.main.k]||0)+it.main.v*m;it.subs.forEach(s=>o[s.k]=(o[s.k]||0)+s.v);return o;}
function sv(k,v){return FLAT[k]?fmt(v):v.toFixed(1);}
function power(it){const s=itemStats(it);let p=0;for(const k in s)p+=FLAT[k]?s[k]/(STB[k]*Math.pow(1.12,it.lvl))*10:s[k]/STB[k]*8;return Math.round(p*10);}

 Object.values(S.eq).forEach(it=>{if(!it)return;const s=itemStats(it);for(const k in s)st[k]+=s[k];});

 const gm=1+0.05*S.gems;st.hp*=ha*gm;st.atk*=aa*gm;st.def*=da*gm;st.crit=Math.min(80,st.crit);S._eqQi=st.qi;return st;}

function blog(t){if(t){B.log.unshift(t);B.log.length=2;}$("blog").innerHTML=B.log.join("<br>");}
function dmg(a,d,m,critF){const h=B.h;let v=a*m*a/(a+d)*(.9+Math.random()*.2);const cr=critF||Math.random()*100<h.crit;if(cr)v*=h.critd/100;return[Math.max(1,v),cr];}
function hitEnemy(m,txt,critF){const[v,cr]=dmg(B.h.atk,B.e.def,m,critF);B.e.hp-=v;B.hitE=.25;BF.push({x:BW*.72,y:BH*.42,t:(cr?"💥":"")+fmt(v),c:cr?"#ffd040":"#fff",l:1,b:cr});
 B.fx.push({t:0,k:"slash"});if(txt)blog(txt+" "+fmt(v));snd(cr?300:420,.12,"square",.04);}
function cast(k){if(!B||B.end)return;if(k===3){if(!(S.pills.heal>0))return toast("ไม่มียาฟื้นพลัง · ไปหลอมที่ ⚗️");if(B.h.hp>=B.h.max)return;S.pills.heal--;heal(.5,"❤️‍🩹 ใช้ยาฟื้นพลัง");buildSkills();return;}
 if(B.cd[k]>0)return;B.cd[k]=B.cdm[k];const h=B.h;
 if(k===0){hitEnemy(S.tree.c3?3.2:2.2,"⚔️ กระบี่เหาะ!");B.fx.push({t:0,k:"sword"});}
 else if(k===1){h.sh=h.max*.3;blog("🛡️ โล่ปราณ ดูดซับ "+fmt(h.sh));snd(600,.3);}
 else{const r=S.root;B.fx.push({t:0,k:"ult"});
  if(r==="fire"){hitEnemy(4,"🔥 ฝ่ามือเพลิง!");B.burn=3;}else if(r==="water"){heal(.4,"💧 ธาราชำระ");}else if(r==="wood"){hitEnemy(2.5,"🌿 เถาวัลย์!");heal(.15);}
  else if(r==="metal"){hitEnemy(3,"⚜️ ดาบทองพันเล่ม!",true);}else{hitEnemy(2.5,"⛰️ ภูผาถล่ม!");B.stun=2;}}
 checkEnd();}
function heal(p,t){const v=B.h.max*p;B.h.hp=Math.min(B.h.max,B.h.hp+v);BF.push({x:BW*.28,y:BH*.4,t:"+"+fmt(v),c:"#7dffb0",l:1});if(t)blog(t+" +"+fmt(v));snd(880,.3);}
function updBattle(dt){if(B.end)return;B.t+=dt;const h=B.h,e=B.e;for(let k=0;k<3;k++)B.cd[k]=Math.max(0,B.cd[k]-dt);
 if(S.auto){if(h.hp<h.max*.35&&S.pills.heal>0)cast(3);else if(B.cd[2]<=0&&!(S.root==="water"&&h.hp>h.max*.6))cast(2);else if(B.cd[0]<=0)cast(0);else if(B.cd[1]<=0&&h.sh<=0&&B.t>2)cast(1);if(B.end)return;}
 B.gh+=h.spd*dt*10;B.ge+=e.spd*dt*10;
 if(B.gh>=100){B.gh-=100;hitEnemy(1,null);if(checkEnd())return;}
 if(B.ge>=100){B.ge-=100;e.acts++;if(B.burn>0){B.burn--;const v=h.atk*.6;e.hp-=v;BF.push({x:BW*.72,y:BH*.3,t:"🔥"+fmt(v),c:"#ff9a4a",l:1});if(checkEnd())return;}
  if(B.stun>0){B.stun--;blog("💫 "+e.name+" มึนงง");}
  else{const big=e.type!=="b"&&e.acts%4===0;let v=e.atk*(big?1.8:1)*e.atk/(e.atk+h.def)*(.9+Math.random()*.2);if(big)blog("☠️ "+e.name+" ใช้ท่าไม้ตาย!");
   if(h.sh>0){const a=Math.min(h.sh,v);h.sh-=a;v-=a;}h.hp-=v;B.hitH=.25;BF.push({x:BW*.28,y:BH*.42,t:"-"+fmt(v),c:"#ff7a7a",l:1,b:big});snd(150,.15,"sawtooth",.04);if(navigator.vibrate&&big)navigator.vibrate(40);}
  checkEnd();}
 const sks=$("skills").querySelectorAll(".sk");for(let k=0;k<3;k++){const p=B.cd[k]/B.cdm[k];sks[k].querySelector(".cd").style.height=(p*100)+"%";sks[k].classList.toggle("rdy",p<=0);}}
function checkEnd(){if(!B||B.end)return true;if(B.e.hp<=0){B.e.hp=0;B.end=1;setTimeout(winBattle,500);return true;}if(B.h.hp<=0){B.h.hp=0;B.end=1;setTimeout(loseBattle,500);return true;}return false;}
function winBattle(){const{r,i,e}=B;const t=e.type;const tm={b:1,el:2.5,bo:6}[t];const m={gold:Math.round(10*Math.pow(1.55,r)*(1+Math.max(0,i)*.15)*tm)};
 m[REG[r].mat]=(t==="bo"?5:t==="el"?2:1);if(Math.random()<.5)m.ore=1+(t!=="b"?2:0);if(Math.random()<.4)m.herb=1+(t!=="b"?1:0);if(t==="bo"){m.dao=2;m.crystal=2;}
 m.qi=Math.round(perSec(S)*15+tapPow(S)*10);addMats(m);const items=[];const n=t==="bo"?2:t==="el"?1:(Math.random()<.3?1:0);
 for(let k=0;k<n;k++){const it=mkItem(null,e.lvl+1,rollRar((t==="bo"?30:t==="el"?15:0)+r*5));S.inv.push(it);items.push(it);}
 S.c.win++;S.c.kill++;if(t==="bo"){S.c.boss++;if(!S.map.cleared.includes(r))S.map.cleared.push(r);}
 if(i>=0)advNode(r,i);chord();
 $("bresb").innerHTML=`<h2>🏆 ชัยชนะ!</h2><div>${rewardTxt(m)}</div>${items.map(itemHtml).join("")}${t==="bo"?`<p>🗺️ ปราบบอส${REG[r].n}แล้ว!${REG[r+1]?" ไปต่อที่ "+REG[r+1].n:""}</p>`:""}<div class="acts"><button class="btn" id="bok">รับของ</button>${items.length?'<button class="btn alt" id="bgo">🎒 ดูสัมภาระ</button>':""}</div>`;
 $("bres").style.display="flex";$("bok").onclick=closeBattle;if($("bgo"))$("bgo").onclick=()=>{closeBattle();document.querySelector('#nav [data-v=inv]').click();};save();}
function loseBattle(){$("bresb").innerHTML=`<h2>💀 พ่ายแพ้</h2><p>${B.e.name} แข็งแกร่งเกินไป<br><small>ลองบำเพ็ญขึ้นชั้น · สวมใส่/เสริมพลังอุปกรณ์ · หลอมยาเสริมกำลัง</small></p><div class="acts"><button class="btn" id="bok">กลับ</button></div>`;$("bres").style.display="flex";$("bok").onclick=closeBattle;}

function drawBattle(dt){const c=bx,w=BW,h=BH,R=REG[B.r];skyGrad(c,w,h,[R.g[0],R.g[1],R.g[2]].reverse());
 ridge(c,w,h,h*.62,h*.25,R.m[0]+"cc",B.r+1,T*6);ridge(c,w,h,h*.78,h*.15,R.m[1],B.r+3,T*12);
 c.globalAlpha=.5;c.font="20px sans-serif";[...R.deco].forEach((d,k)=>{c.fillText(d,((k*120+T*15)%(w+40))-20,h*.2+k*25);});c.globalAlpha=1;
 c.fillStyle="#0005";c.fillRect(0,h*.86,w,h*.14);
 drawHero(c,w*.28,h*.52,.85,T,true);
 B.hitE=Math.max(0,B.hitE-dt);B.hitH=Math.max(0,B.hitH-dt);const es=B.e.type==="bo"?1.15:B.e.type==="el"?1:.85;drawEnemy(c,w*.72,h*.5,es,B.e,T,B.hitE);
 if(B.hitH>0){c.fillStyle=`rgba(255,40,40,${B.hitH})`;c.fillRect(0,0,w,h);}
 if(B.h.sh>0){c.strokeStyle="#8fd8ff";c.lineWidth=3;c.globalAlpha=.6;c.beginPath();c.arc(w*.28,h*.5,62,0,7);c.stroke();c.globalAlpha=1;}
 B.fx=B.fx.filter(f=>{f.t+=dt;const k=f.t/.35;if(k>1)return false;c.save();c.globalAlpha=1-k;
  if(f.k==="slash"){c.strokeStyle="#fff";c.lineWidth=5;c.shadowColor="#9ff";c.shadowBlur=15;c.beginPath();c.moveTo(w*.62,h*.3+k*40);c.lineTo(w*.82,h*.65-k*20);c.stroke();}
  else if(f.k==="sword"){c.translate(w*.28+(w*.44)*k,h*.45);c.rotate(Math.PI/2);c.fillStyle="#dff";c.shadowColor="#9ff";c.shadowBlur=20;c.fillRect(-4,-40,8,60);}
  else{const col={fire:"#ff6a2a",water:"#4ab0ff",wood:"#5ae07a",metal:"#ffd040",earth:"#c08a4a"}[S.root];const g=c.createRadialGradient(w*.72,h*.5,5,w*.72,h*.5,140*k+20);g.addColorStop(0,col);g.addColorStop(1,"transparent");c.fillStyle=g;c.fillRect(0,0,w,h);}
  c.restore();return true;});
 const bar=(x,y,ww,p,col,lab,sh)=>{c.fillStyle="#000a";c.fillRect(x,y,ww,12);c.fillStyle=col;c.fillRect(x,y,ww*Math.max(0,p),12);if(sh>0){c.fillStyle="#8fd8ffaa";c.fillRect(x,y,ww*Math.min(1,sh),12);}c.strokeStyle="#fff8";c.strokeRect(x,y,ww,12);c.fillStyle="#fff";c.font="600 12px KanitE,sans-serif";c.textAlign="left";c.fillText(lab,x,y-4);};
 bar(12,26,w*.42,B.h.hp/B.h.max,"#4ade80","ท่าน "+fmt(B.h.hp)+"/"+fmt(B.h.max),B.h.sh/B.h.max);bar(w*.54,26,w*.42,B.e.hp/B.e.max,"#f87171",B.e.name+" "+fmt(B.e.hp));
 c.fillStyle="#ffd77a";c.fillRect(12,42,w*.42*Math.min(1,B.gh/100),3);c.fillRect(w*.54,42,w*.42*Math.min(1,B.ge/100),3);
 c.textAlign="center";for(let k=BF.length-1;k>=0;k--){const f=BF[k];f.y-=1;f.l-=.02;if(f.l<=0){BF.splice(k,1);continue;}c.globalAlpha=f.l;c.font=`600 ${f.b?30:22}px KanitE,sans-serif`;c.strokeStyle="#000";c.lineWidth=4;c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y);}c.globalAlpha=1;}
// ===== INVENTORY =====
function itemHtml(it){const R=RAR[it.rar],sl=SLOTS.find(s=>s.k===it.slot);return `<div class="cmp" style="border:1px solid ${R.c};box-shadow:0 0 10px ${R.c}55"><b style="color:${R.c}">${sl.ic} ${it.name}${it.enh?" +"+it.enh:""}</b> <small>[${R.n}] Lv.${it.lvl} · พลัง ${power(it)}</small><br>⭐ ${STN[it.main.k]} +${sv(it.main.k,it.main.v*(1+.1*it.enh))}${it.subs.map(s=>`<br><small>• ${STN[s.k]} +${sv(s.k,s.v)}</small>`).join("")}</div>`;}
function cmpHtml(it){const cur=S.eq[it.slot];if(!cur||cur.id===it.id)return"";const a=itemStats(it),b=itemStats(cur);const ks=new Set([...Object.keys(a),...Object.keys(b)]);
 return `<div class="cmp"><small>เทียบกับที่สวมอยู่ (${cur.name}${cur.enh?" +"+cur.enh:""}):</small><br>`+[...ks].map(k=>{const d=(a[k]||0)-(b[k]||0);return `<span class="${d>=0?"up":"dn"}">${STN[k]} ${d>=0?"▲":"▼"}${sv(k,Math.abs(d))}</span>`;}).join(" · ")+"</div>";}
function enhCost(it){return{gold:Math.round(15*Math.pow(1.13,it.lvl)*Math.pow(it.enh+1,1.5)),ore:it.enh+1,ch:Math.max(.35,1-.07*it.enh)};}
function openItem(it){S.seen[it.id]=1;const eq=S.eq[it.slot]&&S.eq[it.slot].id===it.id;const ec=enhCost(it);const sal={gold:Math.round(itemPrice(it)/4),ore:1+it.rar*2};if(it.rar>=3)sal.crystal=1;
 const acts=[];acts.push(eq?["ถอด",()=>{delete S.eq[it.slot];S.inv.push(it);renderAll();}]:["สวมใส่",()=>equip(it)]);
 if(it.enh<10)acts.push([`เสริม +${it.enh+1} (🪙${fmt(ec.gold)} 🪨${ec.ore} · ${Math.round(ec.ch*100)}%)`,()=>enhance(it),"alt"]);
 if(it.rar>=1)acts.push(["เกลาค่ารอง (💠1 🪙"+fmt(ec.gold)+")",()=>refine(it),"alt"]);
 if(!eq)acts.push(["ย่อยสลาย → "+rewardTxt(sal),()=>{S.inv=S.inv.filter(x=>x.id!==it.id);addMats(sal);snd(300,.2);renderAll();},"red"]);
 acts.push(["ปิด",null,"alt"]);modal("รายละเอียด",itemHtml(it)+cmpHtml(it),acts);renderHud();}
function equip(it){const cur=S.eq[it.slot];S.inv=S.inv.filter(x=>x.id!==it.id);if(cur)S.inv.push(cur);S.eq[it.slot]=it;S.c.equip++;snd(660,.2);pulse=1;toast("สวมใส่ "+it.name);renderAll();save();}
function enhance(it){const c=enhCost(it);if(S.gold<c.gold||S.mats.ore<c.ore){toast("วัตถุดิบไม่พอ");return openItem(it);}S.gold-=c.gold;S.mats.ore-=c.ore;
 if(Math.random()<c.ch){it.enh++;S.c.enh++;chord();toast("✨ เสริมพลังสำเร็จ +"+it.enh);}else{snd(120,.4,"sawtooth");toast("💢 เสริมพลังล้มเหลว (ระดับคงเดิม)");}renderAll();openItem(it);}
function refine(it){const c=enhCost(it);if(S.mats.crystal<1||S.gold<c.gold){toast("ต้องใช้ 💠ผลึกเต๋า และ 🪙");return openItem(it);}S.mats.crystal--;S.gold-=c.gold;rollSubs(it);snd(900,.3);renderAll();openItem(it);}
function renderInv(){const st=heroStats();let h=`<div id="herobox"><canvas id="heroc"></canvas><div id="slots">`;
 SLOTS.forEach(s=>{const it=S.eq[s.k];h+=`<div class="slot" data-s="${s.k}" style="${it?`border-color:${RAR[it.rar].c};box-shadow:0 0 8px ${RAR[it.rar].c}66`:""}"><span class="e">${s.ic}</span>${it?`<small style="color:${RAR[it.rar].c}">${it.name}</small>`:`<small style="opacity:.6">${s.n}</small>`}${it&&it.enh?`<span class="en">+${it.enh}</span>`:""}</div>`;});
 h+=`</div></div><div id="stats">${[["❤️","hp"],["⚔️","atk"],["🛡️","def"],["💨","spd"],["🎯","crit"],["💥","critd"],["🌀","qi"]].map(([i,k])=>`<div>${i} ${STN[k]}<b>${sv(k,st[k])}</b></div>`).join("")}<div>${ROOTS[S.root].ic} ราก<b>${ROOTS[S.root].n.slice(3)}</b></div></div>`;
 h+=`<div class="mats">${Object.keys(MATS).map(k=>`<span>${MATS[k].ic} ${S.mats[k]||0}</span>`).join("")}<span>🪙 ${fmt(S.gold)}</span><span>❤️‍🩹 ${S.pills.heal||0}</span></div>`;
 const inv=[...S.inv].sort((a,b)=>b.rar-a.rar||power(b)-power(a));
 h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px"><div class="sec" style="margin:4px 0">🎒 กระเป๋า (${inv.length})</div><button class="btn red" id="bsal" style="font-size:11px;padding:6px 8px">ย่อยของ ธรรมดา/ดี ทั้งหมด</button></div><div id="grid" style="padding:0 8px">`;
 inv.forEach(it=>{const R=RAR[it.rar];const better=!S.eq[it.slot]||power(it)>power(S.eq[it.slot]);h+=`<div class="itm" data-id="${it.id}" style="border-color:${R.c};box-shadow:inset 0 0 12px ${R.c}55">${SLOTS.find(s=>s.k===it.slot).ic}<span class="lv">${it.lvl}</span>${it.enh?`<span class="en">+${it.enh}</span>`:""}${better?'<span style="position:absolute;top:0;right:2px;font-size:11px;color:#7dffb0">▲</span>':""}${!S.seen[it.id]?'<span style="position:absolute;bottom:0;left:2px;font-size:9px;color:#ff6b8b">ใหม่</span>':""}</div>`;});
 if(!inv.length)h+=`<div style="grid-column:1/-1;opacity:.6;font-size:13px;padding:10px;text-align:center">ยังไม่มีของ · ออกผจญภัยในแผนที่ 🗺️ เพื่อหาอุปกรณ์</div>`;
 $("invs").innerHTML=h+"</div>";const hc=$("heroc");hc.width=hc.clientWidth*DPR;hc.height=hc.clientHeight*DPR;
 $("invs").querySelectorAll(".itm").forEach(b=>b.onclick=()=>openItem(S.inv.find(x=>x.id===+b.dataset.id)));
 $("invs").querySelectorAll(".slot").forEach(b=>b.onclick=()=>{const it=S.eq[b.dataset.s];if(it)openItem(it);else toast("ยังไม่มี"+SLOTS.find(s=>s.k===b.dataset.s).n);});
 $("bsal").onclick=()=>{const bad=S.inv.filter(x=>x.rar<=1);if(!bad.length)return toast("ไม่มีของให้ย่อย");const m={gold:0,ore:0};bad.forEach(it=>{m.gold+=Math.round(itemPrice(it)/4);m.ore+=1+it.rar*2;});S.inv=S.inv.filter(x=>x.rar>1);addMats(m);toast("ย่อย "+bad.length+" ชิ้น ได้ "+rewardTxt(m));renderAll();};}
function drawPortrait(){const hc=$("heroc");if(!hc)return;const c=hc.getContext("2d");const w=hc.width/DPR,h=hc.height/DPR;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,w,h);
 const g=c.createRadialGradient(w/2,h*.45,5,w/2,h*.45,w*.7);g.addColorStop(0,"#6a5aa0");g.addColorStop(1,"#140c28");c.fillStyle=g;c.fillRect(0,0,w,h);drawHero(c,w/2,h*.58,w/150,T,true);}

function hasCost(o,g){for(const k in o)if((S.mats[k]||0)<o[k])return false;return S.gold>=g;}
function costTxt(o,g){return Object.entries(o).map(([k,v])=>`<span style="color:${(S.mats[k]||0)>=v?"#cfe":"#f88"}">${MATS[k].ic}${S.mats[k]||0}/${v}</span>`).join(" ")+` <span style="color:${S.gold>=g?"#cfe":"#f88"}">🪙${fmt(g)}</span>`;}
function topRegion(){let r=0;for(let i=0;i<REG.length;i++)if(regionOpen(i))r=i;return r;}
function renderCraft(){let h=`<div class="mats" style="padding:0 0 6px">${Object.keys(MATS).map(k=>`<span>${MATS[k].ic} ${S.mats[k]||0}</span>`).join("")}<span>🪙 ${fmt(S.gold)}</span></div>`;

function newW(){return {age:16,karma:0,rep:0,blood:[],disc:{},visit:{},done:{},f:{},cs:{c1:0,c2:0,c3:0},end:{},tk:{},npc:{},comp:[],rankp:{},leg:{},st:{},sect:null,srank:0,contrib:0,log:[],news:["มีข่าวลือว่าประตูสุสานเทพใต้บึงมรณะเริ่มเปิดออก หลังปิดผนึกมานาน 3,000 ปี"],sched:[],title:[],beat:{},yt:0,lastNpcT:0};}
function initW(){const d=newW();S.w=Object.assign(d,S.w||{});for(const k of["disc","visit","done","f","cs","end","tk","npc","rankp","leg","st","beat"])S.w[k]=Object.assign({},d[k],S.w[k]||{});
 NPCS.forEach(n=>{if(!S.w.npc[n.id])S.w.npc[n.id]={rel:0,met:0,mem:[],st:"ok"};if(S.w.rankp[n.id]==null)S.w.rankp[n.id]=n.L;});
 LEGS.forEach(l=>{if(!S.w.leg[l.id])S.w.leg[l.id]={holder:l.holder};});
 if(!S.w.tk.k1&&!S.w._seed){S.w._seed=1;S.w.tk.k1={m:1};}}
initW();
const W3=()=>S.w;
function hasF(f){return !!S.w.f[f];}
function setF(f){(Array.isArray(f)?f:[f]).forEach(x=>S.w.f[x]=1);}
function tkM(id){return S.w.tk[id]?S.w.tk[id].m:0;}
function catList(c){return Object.keys(S.w.tk).filter(id=>{const t=TKX(id);return t&&t.c===c;});}
function TKX(id){return TK.find(t=>t.id===id);}
function realmI(){return Math.min(6,Math.floor(S.L/SUBS));}
// ---- technique & status bonus aggregation ----
function bonus(k){let v=0;for(const id in S.w.tk){const t=TKX(id);if(!t||!t.e[k])continue;let m=S.w.tk[id].m;let x=t.e[k]*(k==="det"||k==="trib"||k==="yr"?1:(.6+.4*m));if(t.root&&t.root===S.root)x*=1.5;if(S.w.tk[id].dev)x*=.5;v+=x;}
 if(S.w.sect){const sc=SECTS.find(s=>s.id===S.w.sect);if(sc.buff[k])v+=sc.buff[k]*(1+.15*S.w.srank);}
 if(k==="pw"){if(S.w.blood.includes("มังกร"))v+=8;if(S.w.blood.includes("มาร"))v+=10;}
 if(k==="qi"&&S.w.blood.includes("เทพบรรพกาล"))v+=15;
 const L=LEGS.find(l=>S.w.leg[l.id].holder==="you"&&k==="pw");if(L)v+=0;
 return v;}
function stOn(k){const s=S.w.st[k];return s&&s.until>S.w.age;}
function stLeft(k){const s=S.w.st[k];return s?(s.until>=9000?"ถาวร":Math.max(0,Math.ceil(s.until-S.w.age))+" ปี"):"";}
function addSt(k,yrs){if((k==="curse")&&tkM("k24"))yrs=Math.ceil(yrs/2);if(k==="injury"&&S.w.blood.includes("หงส์"))yrs=Math.ceil(yrs/2);
 const cur=S.w.st[k];const u=yrs>=9000?99999:S.w.age+yrs;S.w.st[k]={until:Math.max(cur&&cur.until>S.w.age?cur.until:0,u)};}
// override econ multipliers (v2 functions are global)
const _qiMul=qiMul;qiMul=function(s){let m=_qiMul(s)*(1+bonus("qi")/100);if(stOn("poison"))m*=.7;if(stOn("curse"))m*=.85;if(stOn("bless"))m*=1.25;return m;};
const _tapPow=tapPow;tapPow=function(s){let v=_tapPow(s)*(1+bonus("tap")/100);if(stOn("dev"))v*=.5;return v;};
function lifespan(){let l=LIFESPAN[realmI()];l*=1+bonus("life")/100;if(S.w.blood.includes("เทพบรรพกาล"))l*=1.5;return Math.round(l+(S.w.lifeAdj||0));}
// ---- combat power ----
function myPower(){const st=heroStats();let p=st.atk*4+st.def*3+st.hp*.25+st.spd*2;p*=1+bonus("pw")/100;p*=1+Math.min(40,bonus("def"))/200;
 if(stOn("injury"))p*=.7;if(stOn("curse"))p*=.85;return Math.round(p);}
function rawPow(L){const g=Math.pow(1.11,L);return 12*g*4+5*g*3+120*g*.25+20;}
function basePow(L){return rawPow(L)*1.3;}
function npcPower(id){return Math.round(basePow(S.w.rankp[id]||0)*(1+(S.w.npc[id].pw||0)/100));}
function pwRel(){return myPower()/rawPow(S.L);} // ~1.0 baseline
// ---- conditions ----
function chk(c){if(!c)return true;
 if(c.all)return c.all.every(chk);if(c.or)return c.or.some(chk);
 if(c.n){const[fl,k]=c.n;return fl.filter(hasF).length>=k;}
 if(c.gold!=null&&S.gold<c.gold)return false;if(c.f&&!hasF(c.f))return false;if(c.nf&&hasF(c.nf))return false;
 if(c.tk&&!tkM(c.tk))return false;if(c.tkm&&tkM(c.tkm[0])<c.tkm[1])return false;
 if(c.cat&&!catList(c.cat).length)return false;if(c.catn&&catList(c.catn[0]).length<c.catn[1])return false;
 if(c.catm&&!catList(c.catm[0]).some(id=>tkM(id)>=c.catm[1]))return false;
 if(c.rel&&S.w.npc[c.rel[0]].rel<c.rel[1])return false;if(c.comp&&!S.w.comp.includes(c.comp))return false;if(c.anycomp&&!S.w.comp.length)return false;
 if(c.realm!=null&&realmI()<c.realm)return false;if(c.karma!=null&&S.w.karma<c.karma)return false;if(c.nkarma!=null&&S.w.karma>c.nkarma)return false;
 if(c.pill&&!(S.pills[c.pill]>0))return false;if(c.mat){for(const k in c.mat)if((S.mats[k]||0)<c.mat[k])return false;}
 if(c.sect&&S.w.sect!==c.sect)return false;if(c.nosect&&S.w.sect)return false;if(c.srank&&!(S.w.sect===c.srank[0]&&S.w.srank>=c.srank[1]))return false;
 if(c.blood&&!S.w.blood.includes(c.blood))return false;if(c.pw!=null&&pwRel()*100<c.pw)return false;
